<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#101010" />
<meta name="robots" content="noindex, nofollow" />
<title>Kavita Uchila — Admin</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap");
:root {
  --lime: #e9ff2f;
  --ink: #080808;
  --paper: #e9ff2f;
  --paper-soft: #d8ed2c;
  --white: #f6f5ee;
  --muted: rgba(246, 245, 238, 0.58);
  --line: rgba(246, 245, 238, 0.22);
  --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Space Grotesk", Arial, Helvetica, sans-serif;
  color: var(--white);
  background: var(--ink);
  font-family: var(--sans);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--ink); }
.cursor-orbit { position: fixed; z-index: 50; width: 58px; height: 58px; margin: -29px 0 0 -29px; border: 1px solid var(--paper); border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(.5); transition: opacity .18s ease, transform .24s cubic-bezier(.2,.8,.2,1); mix-blend-mode: difference; display: grid; place-items: center; }
* { box-sizing: border-box; }
html { background: var(--ink); }
body { margin: 0; min-width: 320px; background: #101010; color: var(--white); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { border: 0; font: inherit; }
::selection { color: var(--ink); background: var(--paper); }
/* Admin control room */
.admin-loading { min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 11px/1 var(--mono); letter-spacing: .14em; }
.admin-login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 8vw; background: radial-gradient(circle at 80% 15%, rgba(233,255,47,.1), transparent 30%), var(--ink); }
.admin-login__mark { position: absolute; top: 5vw; right: 5vw; color: var(--paper); font: 700 clamp(4rem, 10vw, 9rem)/.7 var(--sans); letter-spacing: -.16em; }
.admin-login > .eyebrow { color: var(--paper); margin-bottom: 2rem; }
.admin-login h1 { margin: 0 0 3rem; color: var(--white); font-size: clamp(4rem, 11vw, 10rem); line-height: .74; letter-spacing: -.13em; }
.admin-login h1 em { color: var(--paper); font-style: normal; }
.admin-login form { display: grid; width: min(100%, 420px); gap: 10px; }
.admin-login label, .admin-form-grid label, .admin-homepage label, .admin-slide-editor label { color: var(--muted); font: 9px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.admin-login input, .admin-form-grid input, .admin-form-grid textarea, .admin-homepage input, .admin-homepage select, .admin-slide-editor input, .admin-slide-editor textarea { width: 100%; border: 1px solid var(--line); border-radius: 0; outline: none; padding: 13px 12px; background: rgba(246,245,238,.04); color: var(--white); font: 13px/1.3 var(--sans); transition: border-color .2s ease, background .2s ease; }
.admin-login input:focus, .admin-form-grid input:focus, .admin-form-grid textarea:focus, .admin-homepage input:focus, .admin-homepage select:focus, .admin-slide-editor input:focus, .admin-slide-editor textarea:focus { border-color: var(--paper); background: rgba(233,255,47,.06); }
.admin-login button, .admin-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; border: 1px solid var(--paper); padding: 12px 15px; color: var(--ink); background: var(--paper); font: 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
.admin-login button { margin-top: 12px; justify-content: space-between; width: 100%; }
.admin-login button:hover, .admin-button:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(233,255,47,.14); }
.admin-login button:disabled, .admin-button:disabled { opacity: .5; cursor: wait; transform: none; }
.admin-login__back { width: fit-content; margin-top: 3rem; color: var(--muted); font: 10px/1 var(--mono); letter-spacing: .1em; }
.admin-login__back:hover { color: var(--paper); }
.admin-error { margin: 7px 0 0; color: #ff9c9c; font: 11px/1.3 var(--mono); }
.admin-shell { min-height: 100vh; display: grid; grid-template-columns: 235px 1fr; background: #101010; color: var(--white); }
.admin-sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 32px 22px 24px; border-right: 1px solid var(--line); background: #0b0b0b; }
.admin-brand { color: var(--paper); font: 700 22px/.76 var(--sans); letter-spacing: -.11em; }
.admin-brand strong { color: var(--white); font-weight: 700; }
.admin-sidebar__label { margin: 5.5rem 0 1.3rem; color: var(--muted); font: 8px/1 var(--mono); letter-spacing: .12em; }
.admin-sidebar nav { display: grid; gap: 4px; }
.admin-sidebar nav button, .admin-logout { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 9px; border: 0; background: transparent; color: var(--muted); font: 10px/1 var(--mono); letter-spacing: .08em; text-align: left; cursor: pointer; }
.admin-sidebar nav button:hover, .admin-sidebar nav button.is-active, .admin-logout:hover { color: var(--paper); background: rgba(233,255,47,.06); }
.admin-sidebar nav button b { margin-left: auto; color: var(--paper); font-weight: 400; }
.admin-logout { margin-top: auto; }
.admin-main { min-width: 0; padding: 38px clamp(24px, 5vw, 72px) 80px; }
.admin-topbar { display: flex; align-items: end; justify-content: space-between; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.admin-topbar .eyebrow, .admin-section-head .eyebrow, .admin-editor__head .eyebrow, .admin-homepage .eyebrow, .admin-slide-editor .eyebrow { color: var(--paper); }
.admin-topbar h1 { margin: 13px 0 0; font-size: clamp(2.5rem, 5vw, 5rem); line-height: .78; letter-spacing: -.1em; }
.admin-live { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font: 9px/1 var(--mono); letter-spacing: .1em; }
.admin-live i { width: 6px; height: 6px; display: inline-block; border-radius: 50%; background: var(--paper); animation: blink 1.5s ease-in-out infinite; }
.admin-toast { display: flex; align-items: center; gap: 8px; margin: 18px 0 -2px; color: var(--paper); font: 10px/1.2 var(--mono); }
.admin-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-top: 35px; }
.admin-stat, .admin-quick { min-height: 190px; padding: 19px; border: 1px solid var(--line); background: rgba(246,245,238,.025); }
.admin-stat { display: flex; flex-direction: column; }
.admin-stat > span { color: var(--muted); font: 9px/1 var(--mono); letter-spacing: .1em; }
.admin-stat strong { margin: auto 0 4px; color: var(--paper); font: 700 clamp(3.8rem, 8vw, 7rem)/.65 var(--sans); letter-spacing: -.14em; }
.admin-stat small { color: var(--muted); font: 8px/1 var(--mono); letter-spacing: .08em; }
.admin-quick { grid-column: 1 / -1; min-height: 230px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; background: linear-gradient(120deg, rgba(233,255,47,.1), transparent 52%); }
.admin-quick h2, .admin-section-head h2, .admin-editor__head h2 { margin: 12px 0 0; font-size: clamp(2rem, 4vw, 4.5rem); line-height: .82; letter-spacing: -.1em; }
.admin-projects { display: grid; grid-template-columns: minmax(260px, .75fr) minmax(380px, 1.25fr); gap: 28px; padding-top: 35px; }
.admin-section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.admin-project-list, .admin-editor { min-width: 0; }
.admin-project-row { position: relative; display: grid; grid-template-columns: 30px 1fr auto 8px; align-items: center; gap: 9px; width: 100%; min-height: 67px; padding: 12px 10px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--white); text-align: left; cursor: pointer; }
.admin-project-row:last-child { border-bottom: 1px solid var(--line); }
.admin-project-row:hover, .admin-project-row.is-selected { color: var(--paper); background: rgba(233,255,47,.06); }
.admin-project-row > span, .admin-project-row > small, .admin-project-row > em { font: 8px/1 var(--mono); letter-spacing: .07em; }
.admin-project-row > strong { font-size: 16px; line-height: .9; letter-spacing: -.05em; }
.admin-project-row > small { color: var(--muted); text-transform: uppercase; }
.admin-project-row > em { grid-column: 2 / 4; color: var(--paper); font-style: normal; }
.admin-project-row > i { width: 6px; height: 6px; border-radius: 50%; background: #584b4b; }
.admin-project-row > i.is-published { background: var(--paper); }
.admin-editor { padding: 23px; border: 1px solid var(--line); background: rgba(246,245,238,.025); }
.admin-editor__head { display: flex; align-items: start; justify-content: space-between; padding-bottom: 25px; border-bottom: 1px solid var(--line); }
.admin-icon-button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,156,156,.5); background: transparent; color: #ff9c9c; cursor: pointer; }
.admin-form-grid, .admin-homepage__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; padding: 25px 0; }
.admin-form-grid label, .admin-homepage label, .admin-slide-editor label { display: grid; gap: 8px; }
.admin-form-grid__wide { grid-column: 1 / -1; }
.admin-form-grid textarea, .admin-slide-editor textarea { resize: vertical; min-height: 90px; }
.admin-upload-line { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -2px; }
.admin-upload-button { display: inline-flex !important; align-items: center; gap: 7px; width: fit-content !important; padding: 9px 11px; border: 1px dashed rgba(233,255,47,.65); color: var(--paper) !important; background: rgba(233,255,47,.05); cursor: pointer; font-size: 8px !important; }
.admin-upload-button:hover { background: rgba(233,255,47,.14); }
.admin-upload-button input { display: none; }
.admin-upload-hint { display: inline-block; margin-left: 10px; font: 8px/1 var(--mono); letter-spacing: .06em; color: var(--muted); }
.admin-carousel-slot__upload, .admin-frame-card__upload { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.admin-form-grid input[readonly] { color: var(--muted); border-style: dashed; }
.admin-checks { display: flex; flex-wrap: wrap; gap: 18px; padding: 16px 0 22px; border-top: 1px solid var(--line); color: var(--white); font: 10px/1 var(--mono); letter-spacing: .06em; }
.admin-checks label { display: flex; align-items: center; gap: 8px; color: var(--white); }
.admin-checks input { accent-color: var(--paper); }
.admin-save { width: 100%; }
.admin-empty { min-height: 420px; display: grid; place-items: center; align-content: center; gap: 12px; color: var(--muted); text-align: center; }
.admin-empty svg { color: var(--paper); }
.admin-homepage { max-width: 980px; padding-top: 35px; }
.admin-homepage__grid { padding: 28px 0 36px; }
.admin-homepage select option { background: #171717; color: var(--white); }
.admin-homepage small, .admin-slide-editor small { display: block; color: var(--muted); font: 9px/1.3 var(--mono); letter-spacing: .02em; text-transform: none; }
.admin-slide-editor { display: grid; gap: 15px; max-width: 680px; padding-top: 25px; border-top: 1px solid var(--line); }
@media (max-width: 900px) {
  .admin-shell { grid-template-columns: 1fr; }
  .admin-sidebar { position: static; height: auto; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; padding: 18px 5vw; border-right: 0; border-bottom: 1px solid var(--line); }
  .admin-sidebar__label { display: none; }
  .admin-sidebar nav { grid-column: 1 / -1; grid-row: 2; grid-template-columns: repeat(3, 1fr); }
  .admin-sidebar nav button { justify-content: center; }
  .admin-logout { margin: 0; width: auto; }
  .admin-main { padding: 28px 5vw 60px; }
  .admin-projects { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .admin-topbar { align-items: start; flex-direction: column; gap: 20px; }
  .admin-overview { grid-template-columns: 1fr 1fr; }
  .admin-quick { grid-column: 1 / -1; }
  .admin-form-grid, .admin-homepage__grid { grid-template-columns: 1fr; }
  .admin-form-grid__wide { grid-column: auto; }
  .admin-section-head { align-items: start; flex-direction: column; }
  .admin-project-row { grid-template-columns: 24px 1fr 8px; }
  .admin-project-row > small, .admin-project-row > em { grid-column: 2; }
  .admin-editor { padding: 16px; }
  .admin-login { padding: 28vw 7vw; }
}


/* Stage 1 + 2: carousel slots and project storyboards */
.admin-carousel-block { margin-top: 2.2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,.14); }
.admin-carousel-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.admin-carousel-slot { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.13); }
.admin-carousel-slot__index { color: var(--lime); font: 700 11px/1 var(--mono); }
.admin-carousel-slot__preview { aspect-ratio: 16/9; overflow: hidden; background: #111; display: grid; place-items: center; color: rgba(255,255,255,.4); font: 700 9px/1 var(--mono); }
.admin-carousel-slot__preview video { width: 100%; height: 100%; object-fit: cover; }
.admin-carousel-slot label, .admin-frame-card label { display: flex; flex-direction: column; gap: 6px; color: rgba(255,255,255,.65); font: 700 9px/1.2 var(--mono); letter-spacing: .08em; }
.admin-carousel-slot input, .admin-frame-card input, .admin-frame-card select { width: 100%; }
.admin-frame-card { margin: 0; padding: 12px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.13); display: flex; flex-direction: column; gap: 8px; }
.admin-frame-card__top { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--lime); font: 700 9px/1 var(--mono); }
.admin-frame-card__actions { display: flex; gap: 5px; }
.admin-frame-card__actions button { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.2); color: var(--paper); background: transparent; cursor: pointer; font-size: 10px; }
.admin-frame-card__actions button:hover { border-color: var(--lime); color: var(--lime); }
.admin-frame-card__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.admin-frames { margin-top: 2.2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,.14); }
.admin-frames .admin-section-head h2 { font-size: 1.2rem; }

/* Grid de quadros no admin — disposição lado a lado */
.admin-frame-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 14px; }
.project-frames { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 6rem 0; display: grid; gap: 3rem; }
.project-frame { display: grid; gap: 1rem; }
.project-frame__media { overflow: hidden; background: #101010; }
.project-frame__media img, .project-frame__media video { display: block; width: 100%; height: 100%; object-fit: cover; }
.project-frame--wide .project-frame__media { aspect-ratio: 16/8; }
.project-frame--portrait { width: min(620px, 72%); }
.project-frame--portrait .project-frame__media { aspect-ratio: 4/5; }
.project-frame--square { width: min(680px, 72%); }
.project-frame--square .project-frame__media { aspect-ratio: 1; }
.project-frame--fullscreen .project-frame__media { min-height: 78vh; }
.project-frame--split { width: 58%; margin-left: auto; }
.project-frame--split .project-frame__media { aspect-ratio: 4/3; }

/* Preview dos quadros no admin */
.admin-frame-card__preview { margin-top: 8px; border: 1px solid rgba(255,255,255,.12); background: #0a0a0a; overflow: hidden; display: grid; place-items: center; min-height: 80px; max-height: 120px; position: relative; aspect-ratio: 16/9; }
.admin-frame-card__preview img,
.admin-frame-card__preview video,
.admin-frame-card__preview iframe { width: 100%; height: 100%; object-fit: cover; display: block; }
.admin-frame-preview__empty { color: rgba(255,255,255,.35); font: 9px/1 var(--mono); letter-spacing: .05em; text-align: center; padding: 12px; }
.admin-frame-preview__text { padding: 10px; color: var(--paper); font: 700 clamp(1rem, 2.5vw, 1.4rem)/1.1 var(--sans); letter-spacing: -.03em; text-align: center; background: var(--lime); color: var(--ink); max-width: 100%; }
.project-frame__copy { display: grid; grid-template-columns: minmax(140px, .35fr) 1fr; gap: 2rem; padding-top: .5rem; color: var(--ink); }
.project-frame__copy strong { font: 700 10px/1.3 var(--mono); text-transform: uppercase; }
.project-frame__copy p { max-width: 540px; margin: 0; font: 500 clamp(1.1rem, 2vw, 1.8rem)/1.08 var(--sans); }
.project-frames--gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.project-frames--gallery .project-frame--wide, .project-frames--gallery .project-frame--fullscreen { grid-column: 1 / -1; }
.project-frames--split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.project-frames--split .project-frame--wide, .project-frames--split .project-frame--fullscreen { grid-column: 1 / -1; }
@media (max-width: 720px) { .admin-carousel-grid, .admin-frame-card__grid, .admin-frame-grid, .project-frames--gallery, .project-frames--split { grid-template-columns: 1fr; } .project-frames { width: min(100% - 28px, 620px); padding: 3.5rem 0; gap: 2rem; } .project-frame--portrait, .project-frame--square, .project-frame--split { width: 100%; margin-left: 0; } .project-frame--fullscreen .project-frame__media { min-height: 58vh; } .project-frame__copy { grid-template-columns: 1fr; gap: .7rem; } }
.project-frame__media--text { min-height: 280px; padding: clamp(2rem, 7vw, 7rem); display: flex; align-items: center; background: var(--lime); }
.project-frame__media--text p { max-width: 820px; margin: 0; color: var(--ink); font: 700 clamp(2rem, 6vw, 6rem)/.9 var(--sans); letter-spacing: -.06em; }
.admin-field-heading { display: block; margin-bottom: 8px; color: var(--lime); font: 700 10px/1 var(--mono); letter-spacing: .1em; }
.admin-live-frame-editor { padding: 14px; border: 1px solid rgba(210,255,63,.35); background: rgba(210,255,63,.045); }
.admin-live-frame-preview { width: 100%; aspect-ratio: 16/5; overflow: hidden; display: grid; place-items: center; margin-bottom: 10px; background: #111; color: rgba(255,255,255,.45); font: 700 9px/1 var(--mono); }
.admin-live-frame-preview video { width: 100%; height: 100%; object-fit: cover; }
.admin-live-frame-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.admin-button--small { padding: 6px 9px; font-size: 7px !important; border: 1px solid rgba(233,255,47,.45); color: rgba(255,255,255,.75) !important; background: rgba(233,255,47,.08); }
.admin-button--small:hover { border-color: var(--paper); color: var(--paper) !important; background: rgba(233,255,47,.16); }
.hero__live-frame-background { position: absolute; z-index: 0; inset: -7%; width: 114%; height: 114%; object-fit: cover; opacity: .48; filter: blur(95px) saturate(1.35); transform: scale(1.16); pointer-events: none; }
.hero__video-wrap > .hero__video, .hero__video-wrap > .hero__video-wash, .hero__video-wrap > .hero__copy, .hero__video-wrap > .hero__flow, .hero__video-wrap > .hero__text-slide, .hero__video-wrap > .hero__reel, .hero__video-wrap > .hero__video-caption { position: relative; z-index: 2; }
.hero__video-wrap > .hero__video-wash { z-index: 1; }
.hero__video-wrap > .hero__video-wash { position: absolute; inset: 0; }
.admin-login__note { max-width: 420px; margin: 2.2rem 0 0; color: rgba(246,245,238,.42); font: 9px/1.6 var(--mono); letter-spacing: .03em; }
.admin-login__note code { color: var(--paper); font-size: 9px; }
.admin-sidebar .admin-logout[data-act="reset"] { margin-top: auto; }
.admin-sidebar .admin-logout[data-act="logout"] { margin-top: 6px; }
.admin-upload-button input { display: none; }

/* --- fixes for controls the app css styles inconsistently --- */

/* selects inside the project editor / frame cards had no styling at all */
.admin-form-grid select, .admin-frame-card select {
  width: 100%; border: 1px solid var(--line); border-radius: 0; outline: none;
  padding: 13px 32px 13px 12px; background-color: rgba(246,245,238,.04); color: var(--white);
  font: 13px/1.3 var(--sans); appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--paper) 50%), linear-gradient(135deg, var(--paper) 50%, transparent 50%);
  background-position: calc(100% - 17px) calc(50% + 2px), calc(100% - 12px) calc(50% + 2px);
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  transition: border-color .2s ease, background-color .2s ease;
}
.admin-form-grid select:focus, .admin-frame-card select:focus { border-color: var(--paper); background-color: rgba(233,255,47,.06); }
.admin-form-grid select option, .admin-frame-card select option { background: #171717; color: var(--white); }

/* textareas inside the homepage / about forms kept the browser default (white) */
.admin-homepage textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 0; outline: none;
  padding: 13px 12px; background: rgba(246,245,238,.04); color: var(--white);
  font: 13px/1.4 var(--sans); resize: vertical;
  transition: border-color .2s ease, background .2s ease;
}
.admin-homepage textarea:focus { border-color: var(--paper); background: rgba(233,255,47,.06); }

/* long values were pushing the two-column grid past the viewport */
.admin-homepage__grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.admin-homepage__grid input, .admin-homepage__grid textarea { min-width: 0; }

/* keep the panel from scrolling sideways */
html, body { overflow-x: hidden; max-width: 100%; }
.admin-shell { max-width: 100vw; }
.admin-main { overflow-x: hidden; }
.admin-project-row > strong, .admin-topbar h1 { overflow-wrap: anywhere; }
.admin-form-grid input, .admin-form-grid textarea { min-width: 0; }

</style>
</head>

<div id="root"><div class="admin-loading">A CARREGAR ADMIN / KU</div></div>
<script>
/* ---- admin panel: seed data mirroring server/content.ts ---- */
(function () {
  "use strict";

  var V = {

        if (data && Array.isArray(data.projects) && data.homepage) {
          state = data;
          return;
        }
      }

      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && Array.isArray(parsed.projects) && parsed.homepage) {

        }
      }
    } catch (e) {}
  }

  /* ---------- local media store ----------
     Files picked in the panel are kept in IndexedDB and referenced as
     "idb:<key>", so they survive a page reload. A plain object URL would
     die the moment you refresh. The resolver runs on every render and
     swaps each idb: reference for a fresh blob: URL.                    */
  var IDB_NAME = "kavita-media";
  var IDB_STORE = "files";
  var mediaCache = {};      /* key -> object URL currently used in the DOM */
  var mediaMissing = {};    /* key -> true when the blob is gone           */

  function idb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbPut(key, file) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(file, key);
        tx.oncomplete = function () { db.close(); resolve(key); };
        tx.onerror = function () { db.close(); reject(tx.error); };
      });
    });
  }

  function idbGet(key) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function () { db.close(); resolve(req.result || null); };
        req.onerror = function () { db.close(); reject(req.error); };
      });
    });
  }

  function idbClear() {
    return idb().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).clear();
        tx.oncomplete = function () { db.close(); resolve(); };
        tx.onerror = function () { db.close(); resolve(); };
      });
    });
  }

  function mediaUrl(value) {
    if (typeof value !== "string" || value.indexOf("idb:") !== 0) return value;
    var key = value.slice(4);
    if (mediaCache[key]) return mediaCache[key];
    if (mediaMissing[key]) return "";
    mediaMissing[key] = true;               /* optimistic; cleared on success */
    idbGet(key).then(function (blob) {
      if (!blob) return;
      delete mediaMissing[key];
      mediaCache[key] = URL.createObjectURL(blob);
      render();                              /* second pass swaps in the blob */
    }).catch(function () {});
    return "";
  }

    return (bytes / (1024 * 1024)).toFixed(1) + " MB";

    var s = storageData.summary || {};

    var missing = storageData.missingRefs || [];
    var html = '<div class="admin-overview">' +
      '<div class="admin-stat"><span>FICHEIROS</span><strong>' + (s.files || 0) + '</strong><small>' + humanSize(s.totalBytes) + ' NO SERVIDOR</small></div>' +

      '<div class="admin-stat"><span>DUPLICADOS</span><strong>' + (s.duplicateFiles || 0) + '</strong><small>' + humanSize(s.duplicateBytes) + ' RECUPERÁVEIS</small></div>' +
      '<div class="admin-stat"><span>NÃO USADOS</span><strong>' + (s.orphanFiles || 0) + '</strong><small>' + humanSize(s.orphanBytes) + ' FORA DO SITE</small></div>' +

      '<button class="admin-button" data-act="storage-cleanup">MOVER NÃO USADOS</button> ' +
      '<button class="admin-button" data-act="storage-refresh">ATUALIZAR</button></div>';

    if (renames.length) {
      html += '<div class="admin-quick"><span class="eyebrow">A ORGANIZAR</span><h2>' + renames.length + (renames.length === 1 ? ' ficheiro' : ' ficheiros') + ' por renomear.</h2>' +

    }

    if (missing.length) {
      html += '<div class="admin-frames"><div class="admin-section-head"><div><span class="eyebrow">ATENÇÃO</span><h2>Ficheiros em falta</h2></div></div>' +
        missing.map(function (name) {
          return '<div class="admin-frame-card"><strong>' + esc(name) + '</strong><span class="admin-upload-hint">Referenciado no site, mas não existe em uploads.</span></div>';
        }).join('') + '</div>';
    }

    if (groups.length) {
      html += '<div class="admin-frames"><div class="admin-section-head"><div><span class="eyebrow">DUPLICADOS</span><h2>' + groups.length + (groups.length === 1 ? ' grupo' : ' grupos') + '</h2></div></div>';
      groups.forEach(function (g) {
        html += '<div class="admin-frame-card"><strong>' + esc(g.canonical) + '</strong>' +
          '<span class="admin-upload-hint">' + g.files.length + ' cópias · ' + humanSize(g.size) + ' cada · liberta ' + humanSize(g.reclaimableBytes) + '</span>' +
          '<span class="admin-upload-hint">' + g.files.map(function (f) { return esc(f.name) + ' (' + f.refs + ' ref.)'; }).join(' · ') + '</span></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="admin-quick"><span class="eyebrow">TUDO LIMPO</span><h2>Sem duplicados.</h2><p>Não há ficheiros repetidos no servidor.</p></div>';
    }

    return html;

  function loadStorage() {
    if (storageBusy) return;
    storageBusy = true;
    storageData = { loading: true };
    render();
    fetch('/api/admin/storage')
      .then(function (res) { return res.json(); })
      .then(function (data) { storageData = data; })
      .catch(function (err) { storageData = { error: String(err && err.message ? err.message : err) }; })
      .finally(function () { storageBusy = false; render(); });
  }

  function storageAction(kind) {
    if (storageBusy) return;
    var text = kind === 'dedupe'
      ? 'Consolidar o armazenamento? Cada conteúdo passa a ter um único ficheiro com o nome do seu hash (os nomes antigos são atualizados no site) e as cópias vão para uploads/_duplicados. É criado um backup do conteúdo.'
      : 'Mover os ficheiros não usados para uploads/_duplicados? Nada é apagado definitivamente.';
    if (!window.confirm(text)) return;

    storageBusy = true;
    render();
    fetch('/api/admin/storage/' + kind, { method: 'POST' })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data.error || 'Erro na operação');
        var data = result.data;
        if (kind === 'dedupe') {
          toast(data.message + ' ' + (data.renamed || 0) + ' renomeado(s) · ' + (data.moved ? data.moved.length : 0) + ' cópia(s) movidas · ' + (data.updatedRefs || 0) + ' referência(s) atualizadas.');
        } else {
          toast(data.message + ' ' + (data.moved ? data.moved.length : 0) + ' ficheiro(s) movidos.');
        }
        storageData = null;
      })
      .catch(function (err) { toast('Erro: ' + (err && err.message ? err.message : err)); })
      .finally(function () {
        storageBusy = false;
        loadStorage();
      });
  }

  /* ---------- binding ---------- */
  function setPath(bind, value) {
    if (!bind) return;
    var m = bind.match(/^(p|h)\.(.+)$/);
    if (m) {
      var target = m[1] === "p" ? selectedProject() : state.homepage;
      if (!target) return;
      target[m[2]] = value;
      return;
    }
    var f = bind.match(/^frame\[(\d+)\]\.(.+)$/);
    if (f) {
      var p = selectedProject();
      if (p && p.frames[+f[1]]) p.frames[+f[1]][f[2]] = value;
      return;
    }
    var g = bind.match(/^gallery\[(\d+)\]\.(.+)$/);
    if (g) {
      if (!state.gallery) state.gallery = [];
      if (state.gallery[+g[1]]) state.gallery[+g[1]][g[2]] = value;
      return;
    }
    var c = bind.match(/^(reel|flow)VideoUrls\[(\d+)\]$/);
    if (c) {
      var arr = c[1] === "reel" ? state.homepage.reelVideoUrls : state.homepage.flowVideoUrls;
      arr[+c[2]] = value;
    }
  }

  function readInputs() {
    if (uploading) return;
    document.querySelectorAll("[data-bind]").forEach(function (el) {
      var bind = el.getAttribute("data-bind");
      var value;
      if (el.type === "checkbox") value = el.checked;
      else if (el.type === "number") value = Number(el.value);
      else if (bind === "h.reelProjectIds" || bind === "h.flowProjectIds") {
        value = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      } else if (bind === "h.slideItems") {
        value = el.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      } else if (bind === "h.aboutPortfolio") {
        value = textToPortfolio(el.value);
      } else value = el.value;
      setPath(bind, value);
    });
  }

  document.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.hasAttribute || !el.hasAttribute("data-bind")) return;
    dirty = true;
    if (el.type === "checkbox") return;
    readInputs();
    if (el.getAttribute("data-bind").indexOf("frame[") === 0 || el.getAttribute("data-bind").indexOf("gallery[") === 0) render();
  });

  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute("data-upload")) {
      var file = el.files && el.files[0];
      if (!file) return;
      var bind = el.getAttribute("data-upload-bind");
      var kind = el.getAttribute("data-upload") === "video" ? "video" : "image";
      var expect = kind === "video" ? "video/" : "image/";
      if (file.type && file.type.indexOf(expect) !== 0) {
        toast("Ficheiro inválido: escolhe " + (kind === "video" ? "um vídeo" : "uma imagem") + ".");
        el.value = "";
        return;
      }
      if (file.size > 100 * 1024 * 1024) {
        toast("Ficheiro demasiado grande (máx. 100 MB).");
        el.value = "";
        return;
      }
      uploading = true;
      // Upload via API
      var formData = new FormData();
      formData.append('file', file);
      fetch('/api/admin/upload', { method: 'POST', body: formData })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.url) {
            // Use the server URL directly
            setPath(bind, data.url);
            dirty = true;
            toast(file.name + " (" + humanSize(file.size) + ") " + (data.reused ? "já existia no servidor — reutilizado sem ocupar espaço" : "enviado para o servidor") + " — clica Guardar para aplicar.");
          } else {
            throw new Error(data.error || 'Upload failed');
          }
          render();
        }).catch(function (err) {
          // Fallback to IndexedDB if API fails
          var key = "m" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
          return idbPut(key, file).then(function () {
            mediaCache[key] = URL.createObjectURL(file);
            delete mediaMissing[key];
            setPath(bind, "idb:" + key);
            dirty = true;
            toast(file.name + " (" + humanSize(file.size) + ") guardado no navegador (servidor indisponível) — clica Guardar para aplicar.");
            render();
          });
        }).finally(function () {
          uploading = false;
        });
      el.value = "";
      return;
    }
    if (el.hasAttribute && el.hasAttribute("data-bind")) {
      dirty = true;
      readInputs();
      if (el.tagName === "SELECT") render();
    }
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.getAttribute("data-form") === "login") {
      var input = document.getElementById("admin-password");
      if (!input || !input.value.trim()) {
        loginError = "Introduz uma palavra-passe.";
      } else {
        loginError = "";
        authed = true;
      }
      render();
      return;
    }
    readInputs();
    persist();
  });

  document.addEventListener("click", function (e) {
    if (e.target.tagName === "INPUT") return;
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");

    if (act === "pick-media") {
      /* stop the surrounding <label> from also forwarding the click to the
         text input, which would steal focus from the file dialog */
      e.preventDefault();
      var fileInput = btn.querySelector('input[type="file"]');
      if (fileInput) fileInput.click();
      return;
    }

    if (act === "section") {
      readInputs();
      section = btn.getAttribute("data-section");
      if (section === "storage" && !storageData) {
        loadStorage();
        return;
      }
      render();
      return;
    }
    if (act === "storage-refresh") {
      storageData = null;
      loadStorage();
      return;
    }
    if (act === "storage-dedupe") {
      storageAction("dedupe");
      return;
    }
    if (act === "storage-cleanup") {
      storageAction("cleanup");
      return;
    }
    if (act === "select") {
      readInputs();
      selectedId = btn.getAttribute("data-id");
      render();
      return;
    }
    if (act === "new-project") {
      readInputs();
      var proj = {
        id: "project-" + Date.now(), index: pad(state.projects.length + 1), label: "NOVO TRABALHO",
        title: "Nova imagem em movimento", tag: "IMAGEM / MOVIMENTO",
        description: "Um novo fragmento em movimento.", role: "DIRECÇÃO VISUAL",
        location: "LUANDA / MUNDO", year: "2026", duration: 10, video: "", coverImage: "", coverVideo: "",
        template: "cinematic", theme: "dark", frames: [], pageURL: "", featured: false, published: false, sortOrder: 99
      };
      state.projects.push(proj);
      selectedId = proj.id;
      section = "projects";
      dirty = true;
      render();
      return;
    }
    if (act === "delete-project") {
      var p = selectedProject();
      if (!p) return;
      if (!window.confirm('Remover "' + p.title + '"?')) return;
      state.projects = state.projects.filter(function (x) { return x.id !== p.id; });
      selectedId = null;
      dirty = true;
      persist();
      toast("Trabalho removido.");
      return;
    }
    if (act === "save-project") {
      readInputs();
      persist();
      toast("Trabalho, quadros e template guardados.");
      return;
    }
    if (act === "save-gallery") {
      readInputs();
      persist();
      toast("Galeria pessoal guardada.");
      return;
    }
    if (act === "add-frame") {
      var pr = selectedProject();
      if (!pr) return;
      readInputs();
      pr.frames.push({ id: "frame-" + Date.now(), mediaType: "image", src: "", caption: "", body: "", layout: "wide", sortOrder: pr.frames.length });
      dirty = true;
      render();
      return;
    }
    if (act === "frame-del" || act === "frame-copy" || act === "frame-up" || act === "frame-down") {
      var proj2 = selectedProject();
      if (!proj2) return;
      readInputs();
      var i = Number(btn.getAttribute("data-i"));
      if (act === "frame-del") proj2.frames.splice(i, 1);
      if (act === "frame-copy") proj2.frames.push(Object.assign({}, proj2.frames[i], { id: "frame-" + Date.now(), sortOrder: proj2.frames.length }));
      if (act === "frame-up" && i > 0) { var tmp = proj2.frames[i - 1]; proj2.frames[i - 1] = proj2.frames[i]; proj2.frames[i] = tmp; }
      if (act === "frame-down" && i < proj2.frames.length - 1) { var t2 = proj2.frames[i + 1]; proj2.frames[i + 1] = proj2.frames[i]; proj2.frames[i] = t2; }
      proj2.frames.forEach(function (fr, o) { fr.sortOrder = o; });
      dirty = true;
      render();
      return;
    }
    if (act === "gallery-add") {
      readInputs();
      if (!state.gallery) state.gallery = [];
      state.gallery.push({
        id: "gallery-" + Date.now(),
        index: String(state.gallery.length + 1),
        title: "Novo item",
        label: "ITEM",
        tag: "IMAGEM / MOVIMENTO",
        year: "2026",
        description: "Um novo item da galeria pessoal.",
        role: "",
        location: "",
        pageURL: "",
        template: "cinematic",
        theme: "dark",
        type: "image",
        src: "",
        caption: "",
        body: "",
        layout: "wide",
        sortOrder: state.gallery.length
      });
      dirty = true;
      render();
      return;
    }
    if (act === "gallery-del" || act === "gallery-copy" || act === "gallery-up" || act === "gallery-down") {
      readInputs();
      if (!state.gallery) state.gallery = [];
      var i = Number(btn.getAttribute("data-i"));
      if (act === "gallery-del") state.gallery.splice(i, 1);
      if (act === "gallery-copy") state.gallery.push(Object.assign({}, state.gallery[i], { id: "gallery-" + Date.now(), sortOrder: state.gallery.length }));
      if (act === "gallery-up" && i > 0) { var tmp = state.gallery[i - 1]; state.gallery[i - 1] = state.gallery[i]; state.gallery[i] = tmp; }
      if (act === "gallery-down" && i < state.gallery.length - 1) { var t2 = state.gallery[i + 1]; state.gallery[i + 1] = state.gallery[i]; state.gallery[i] = t2; }
      dirty = true;
      render();
      return;
    }
    if (act === "clear-live-bg") {
      readInputs();
      state.homepage.liveFrameBackgroundVideo = "";
      dirty = true;
      persist();
      toast("Vídeo de fundo do Live Frame removido.");
      render();
      return;
    }
    if (act === "clear-upload") {
      var bind = btn.getAttribute("data-clear-bind");
      readInputs();
      setPath(bind, "");
      dirty = true;
      persist();
      toast("Vídeo removido.");
      render();
      return;
    }
    if (act === "logout") {
      readInputs();
      authed = false;
      section = "overview";
      selectedId = null;
      message = "";
      render();
      return;
    }
    if (act === "reset") {
      if (!window.confirm("Repor todo o conteúdo original?")) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
      Object.keys(mediaCache).forEach(function (k) { try { URL.revokeObjectURL(mediaCache[k]); } catch (e) {} });
      mediaCache = {};
      mediaMissing = {};
      idbClear();
      fetch('/api/admin/reset', { method: 'POST' })
        .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('reset failed')); })
        .then(function (data) {
          state = (data && data.projects && data.homepage)
            ? { projects: data.projects, homepage: data.homepage }
            : { projects: JSON.parse(JSON.stringify(seedProjects)), homepage: JSON.parse(JSON.stringify(seedHomepage)) };
          selectedId = null;
          dirty = false;
          toast("Conteúdo reposto aos originais.");
          render();
        })
        .catch(function () {
          state = { projects: JSON.parse(JSON.stringify(seedProjects)), homepage: JSON.parse(JSON.stringify(seedHomepage)) };
          selectedId = null;
          dirty = false;
          toast("Reposto localmente. Servidor indisponível.");
          render();
        });
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var target = e.target;
    if (!target || !target.getAttribute || target.getAttribute("data-act") !== "pick-media") return;
    e.preventDefault();
    var fileInput = target.querySelector('input[type="file"]');
    if (fileInput) fileInput.click();
  });

  window.addEventListener("beforeunload", function (e) {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = "";
  });

  loadState().then(render);
})();

</script>
</body>
</html>
